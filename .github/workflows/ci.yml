name: CI

on:
  push:
    branches: ['develop/**']
  pull_request:
    branches: ['develop/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  MAVEN_ARGS: -B -V -e -ntp
  MAVEN_COMMON_FLAGS: "-Dhadoop.profile=3.0 -Drat.skip=true -Dsurefire.firstPartForkCount=0.5C -Dsurefire.secondPartForkCount=0.5C"

jobs:
  compile:
    name: Compile
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
    - name: Compile
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        mvn ${{ env.MAVEN_ARGS }} install -DskipTests ${{ env.MAVEN_COMMON_FLAGS }}
        -Dmaven.javadoc.skip=true
    - name: Save m2 repository
      uses: actions/cache/save@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ github.sha }}

  test:
    name: "${{ matrix.name }}"
    needs: compile
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Small Tests"
            profile: "runSmallTests"
            timeout: 60
          - name: "Medium Tests"
            profile: "runMediumTests"
            timeout: 180
          - name: "Large Tests (Wave 1)"
            profile: "runLargeTests-wave1"
            timeout: 240
          - name: "Large Tests (Wave 2)"
            profile: "runLargeTests-wave2"
            timeout: 240
          - name: "Large Tests (Wave 3)"
            profile: "runLargeTests-wave3"
            timeout: 240

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
    - name: Restore m2 repository
      uses: actions/cache/restore@v4
      with:
        path: ~/.m2/repository
        key: m2-${{ github.sha }}
        fail-on-cache-miss: true
    - name: Run tests
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        mvn ${{ env.MAVEN_ARGS }} test ${{ env.MAVEN_COMMON_FLAGS }}
        -P${{ matrix.profile }}
        ${{ matrix.tests && format('-Dtest={0}', matrix.tests) || '' }}
        ${{ matrix.flags || '' }}
        -Dmaven.javadoc.skip=true
        -Dsurefire.rerunFailingTestsCount=2
        -Dmaven.test.failure.ignore=false
        -fae
    - name: Upload surefire reports
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: surefire-${{ matrix.name }}
        path: |
          **/target/surefire-reports/
          **/target/failsafe-reports/
        if-no-files-found: ignore
