name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  MAVEN_ARGS: -B -V -e -ntp
  MAVEN_COMMON_FLAGS: "-Dhadoop.profile=3.0 -Drat.skip=true -Dsurefire.firstPartForkCount=0.5C -Dsurefire.secondPartForkCount=0.5C"

jobs:
  release:
    name: Build and Release
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Verify tag is on a develop branch
      run: |
        BRANCHES=$(git branch -r --contains ${{ github.sha }} | grep 'origin/develop/' || true)
        if [ -z "$BRANCHES" ]; then
          echo "Tag must be on a develop/** branch. Found on:"
          git branch -r --contains ${{ github.sha }}
          exit 1
        fi
        echo "Tag is on: $BRANCHES"
    - name: Verify CI passed
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        CONCLUSION=$(gh run list --commit ${{ github.sha }} --workflow CI --json conclusion -q '.[0].conclusion')
        if [ -z "$CONCLUSION" ]; then
          echo "No CI run found for this commit. Push to a develop/** branch first."
          exit 1
        fi
        if [ "$CONCLUSION" != "success" ]; then
          echo "CI has not passed for this commit (status: $CONCLUSION)"
          exit 1
        fi
        echo "CI passed"
    - uses: actions/setup-java@v4
      with:
        java-version: 17
        distribution: temurin
        cache: maven
        server-id: arenadata
        server-username: GITHUB_ACTOR
        server-password: GITHUB_TOKEN
    - name: Configure Maven servers for GitHub Packages
      run: |
        cat > ~/.m2/settings.xml <<'EOF'
        <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0">
          <servers>
            <server><id>arenadata</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
            <server><id>github</id><username>${env.GITHUB_ACTOR}</username><password>${env.GITHUB_TOKEN}</password></server>
          </servers>
        </settings>
        EOF
    - name: Verify tag matches pom version
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Maven 3.9+ applies MAVEN_ARGS from the environment; -V would print its banner into VERSION
        MAVEN_ARGS: -B -ntp
      run: |
        TAG=${GITHUB_REF_NAME#v}
        VERSION=$(mvn -B -ntp -q help:evaluate -Dexpression=project.version -DforceStdout)
        if [ "$TAG" != "$VERSION" ]; then
          echo "Tag $TAG does not match pom.xml version $VERSION"
          exit 1
        fi
    - name: Build and deploy to GitHub Packages
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: mvn ${{ env.MAVEN_ARGS }} deploy assembly:single -DskipTests -DdeployAtEnd=true ${{ env.MAVEN_COMMON_FLAGS }} -Dassembly.attach=false
    - name: Generate checksums
      run: |
        shopt -s nullglob
        for f in hbase-assembly/target/hbase-*.tar.gz; do sha512sum "$f" > "$f.sha512"; done
    - name: Generate SBOM
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: >-
        mvn ${{ env.MAVEN_ARGS }} org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom ${{ env.MAVEN_COMMON_FLAGS }} -Dassembly.attach=false
        -DoutputFormat=json -DoutputName=bom
        -DoutputDirectory=${{ github.workspace }}/target
    - name: Vulnerability scan (grype)
      uses: anchore/scan-action@v6
      with:
        sbom: target/bom.json
        fail-build: false
        output-format: json
        output-file: vulnerability-report.json
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        generate_release_notes: true
        prerelease: ${{ contains(github.ref_name, '-rc') }}
        files: |
          hbase-assembly/target/hbase-*.tar.gz
          hbase-assembly/target/hbase-*.tar.gz.sha512
          target/bom.json
          vulnerability-report.json
